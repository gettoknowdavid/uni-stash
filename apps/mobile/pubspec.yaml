name: uni_stash_mobile
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  cached_network_image: ^3.4.1
  flutter_localizations:
    sdk: flutter
  connectivity_plus: ^7.3.1
  dio: ^5.11.0
  envied: ^1.3.8
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.0.0
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  go_router: ^17.5.0
  image_picker: ^1.2.3
  internet_connection_checker_plus: ^3.1.1
  json_annotation: ^4.12.0
  logger: ^2.7.0
  material_ui: ^1.0.1
  retrofit: ^4.10.0
  shadcn_ui: ^0.56.2
  signals_flutter: ^7.1.0
  timeago: ^3.7.1
  web_socket_channel: ^3.0.3

dev_dependencies:
  build_runner: ^2.16.0
  envied_generator: ^1.3.8
  flutter_test:
    sdk: flutter
  freezed: ^4.0.0
  json_serializable: ^6.14.1
  mockito: ^5.8.1
  mocktail: ^1.0.5
  retrofit_generator: ^10.2.9
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true

  fonts:
    - family: ArchivoNarrow
      fonts:
        - asset: assets/Archivo_Narrow/ArchivoNarrow-VariableFont_wght.ttf
        - asset: assets/Archivo_Narrow/ArchivoNarrow-Italic-VariableFont_wght.ttf
          style: italic

    - family: Inter
      fonts:
        - asset: assets/Inter/Inter-VariableFont_opsz,wght.ttf
        - asset: assets/Inter/Inter-Italic-VariableFont_opsz,wght.ttf
          style: italic

    - family: JetBrainsMono
      fonts:
        - asset: assets/JetBrains_Mono/JetBrainsMono-VariableFont_wght.ttf
        - asset: assets/JetBrains_Mono/JetBrainsMono-Italic-VariableFont_wght.ttf
          style: italic
