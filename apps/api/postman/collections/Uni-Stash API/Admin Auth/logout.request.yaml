$kind: http-request
name: Admin Logout
method: POST
url: '{{baseUrl}}/api/v1/admin/auth/logout'
order: 3000
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "refresh_token": "{{adminRefreshToken}}"
    }
docs:
  description: |-
    Revoke the admin refresh token, ending the current admin session.

    Idempotent — passing an already-revoked or unknown token still returns 200.

    ## Request body

    | Field           | Type   | Rules     |
    | --------------- | ------ | --------- |
    | `refresh_token` | string | Non-empty |

    ## Success (200)

    ```json
    {
      "status": true,
      "message": "logged out"
    }
    ```
