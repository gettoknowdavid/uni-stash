$kind: http-request
name: Admin Forgot Password
method: POST
url: '{{baseUrl}}/api/v1/admin/auth/forgot-password'
order: 5000
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "admin@university.edu"
    }
docs:
  description: |-
    Initiate the admin password-reset flow. Sends a 6-digit OTP to the
    registered admin email address.

    Always returns 200 regardless of whether the email exists (prevents
    account enumeration).

    ## Flow

    1. `POST /admin/auth/forgot-password` → OTP sent to email
    2. `POST /admin/auth/reset-password` with OTP code + new password

    ## Request body

    | Field   | Type   | Rules              |
    | ------- | ------ | ------------------ |
    | `email` | string | Valid email format |

    ## Success (200)

    ```json
    {
      "status": true,
      "message": "if an account with that email exists, a reset code has been sent"
    }
    ```
