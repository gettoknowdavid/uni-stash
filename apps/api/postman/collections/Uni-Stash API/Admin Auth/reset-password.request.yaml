$kind: http-request
name: Admin Reset Password
method: POST
url: '{{baseUrl}}/api/v1/admin/auth/reset-password'
order: 6000
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "code": "123456",
      "new_password": "new password 123!"
    }
