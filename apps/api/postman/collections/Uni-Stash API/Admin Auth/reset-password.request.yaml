$kind: http-request
name: Admin Reset Password
method: POST
url: '{{baseUrl}}/api/v1/admin/auth/reset-password'
order: 6000
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "code": "123456",
      "new_password": "new password 123!"
    }
docs:
  description: |-
    Complete the admin password-reset flow using the OTP from email.

    The OTP is consumed atomically — it cannot be reused. After success
    the admin must log in with the new password.

    ## Request body

    | Field          | Type   | Rules                         |
    | -------------- | ------ | ----------------------------- |
    | `code`         | string | Exactly 6 digits (from email) |
    | `new_password` | string | Minimum 10 characters         |

    ## Success (200)

    ```json
    {
      "status": true,
      "message": "password updated successfully"
    }
    ```

    ## Errors

    | Status | Code                | Meaning                          |
    | ------ | ------------------- | -------------------------------- |
    | 400    | `bad_request`       | Invalid or expired OTP           |
    | 422    | `validation`        | Code not 6 digits / password too short |
    | 429    | `too_many_requests` | Rate limited                     |
