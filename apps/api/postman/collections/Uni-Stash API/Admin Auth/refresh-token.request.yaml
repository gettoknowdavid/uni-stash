$kind: http-request
name: Admin Refresh Token
method: POST
url: '{{baseUrl}}/api/v1/admin/auth/refresh'
order: 2000
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "refresh_token": "{{adminRefreshToken}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      if (pm.response.code === 200) {
          const body = pm.response.json();
          pm.collectionVariables.set("accessToken", body.data.access_token);
          pm.collectionVariables.set("refreshToken", body.data.refresh_token);
          pm.collectionVariables.set("adminAccessToken", body.data.access_token);
          pm.collectionVariables.set("adminRefreshToken", body.data.refresh_token);
      }
docs:
  description: |-
    Exchange a valid admin refresh token for a new access + refresh token pair.

    Uses the same token rotation + reuse detection as the student auth flow.
    If a revoked token is presented, the entire admin token family is
    invalidated.

    ## Request body

    | Field           | Type   | Rules     |
    | --------------- | ------ | --------- |
    | `refresh_token` | string | Non-empty |

    ## Success (200)

    ```json
    {
      "status": true,
      "message": "token refreshed",
      "data": {
        "access_token": "eyJ…",
        "refresh_token": "v2.local.…",
        "expires_in": 900
      }
    }
    ```

    ## Errors

    | Status | Code                | Meaning                                   |
    | ------ | ------------------- | ----------------------------------------- |
    | 401    | `unauthorized`      | Token invalid, expired, or reuse detected |
    | 429    | `too_many_requests` | Rate limited                              |
