$kind: http-request
name: Update Category
method: PATCH
url: '{{baseUrl}}/api/v1/categories/{{categoryId}}'
order: 3000
auth:
  type: bearer
  credentials:
    token: "{{adminAccessToken}}"
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "label": "Course Books",
      "sort_order": 2
    }
docs:
  description: |-
    **Admin-only.** Partially updates a category. All fields are optional —
    only provided fields are changed. At least one of `slug`, `label` or
    `sort_order` must be provided.

    ⚠️ Changing `slug` changes the category identifier used in client
    integrations; prefer updating `label` unless the slug itself is wrong.

    ### Success (200)

    ```json
    {
      "status": true,
      "message": "category updated successfully",
      "data": {
        "id": 1,
        "slug": "textbooks",
        "label": "Course Books",
        "message": "category updated successfully"
      }
    }
    ```

    ### Errors

    | Status | Meaning |
    | ------ | ------- |
    | 400    | Empty body (no fields to update) |
    | 401    | Missing/invalid admin token |
    | 403    | Standard admin without `categories: write` permission |
    | 404    | Category not found |
    | 409    | New slug collides with another category |
    | 422    | Validation failed |
