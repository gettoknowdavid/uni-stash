$kind: http-request
name: List Chats
method: GET
url: '{{baseUrl}}/api/v1/chats'
order: 2000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
queryParams:
  - key: limit
    value: '20'
    disabled: true
docs:
  description: |-
    Return all chat threads the authenticated user participates in, ordered
    by most recent message first.

    Each thread includes a preview of the last message, the unread count,
    and the counterpart's profile (the other participant from the requester's
    perspective).

    ## Query params

    | Param   | Default | Max | Description                  |
    | ------- | ------- | --- | ---------------------------- |
    | `limit` | 20      | 50  | Max threads to return        |

    ## Success (200)

    ```json
    {
      "status": true,
      "message": "ok",
      "data": {
        "chats": [
          {
            "id": "01984af1-…",
            "listing_id": "…",
            "listing_title": "Calculus Textbook",
            "counterpart_id": "…",
            "counterpart_name": "Ada Okafor",
            "counterpart_photo_url": null,
            "last_message_preview": "Is it still available?",
            "last_message_at": "2026-09-23T10:55:00Z",
            "unread_count": 2,
            "created_at": "2026-09-20T08:00:00Z"
          }
        ]
      }
    }
    ```

    ## Errors

    | Status | Code           | Meaning                  |
    | ------ | -------------- | ------------------------ |
    | 401    | `unauthorized` | Missing or invalid token |
    | 429    | `too_many_requests` | Rate limited        |
