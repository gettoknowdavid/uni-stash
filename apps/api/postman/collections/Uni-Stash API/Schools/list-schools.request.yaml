$kind: http-request
name: List Schools
method: GET
url: '{{baseUrl}}/api/v1/schools'
order: 1000
auth:
  type: noauth
queryParams:
  - key: search
    value: ''
    disabled: true
docs:
  description: |-
    Return all partner schools. Public endpoint — no authentication required.

    Used during sign-up to let users discover which schools are supported,
    and to validate that a registration email domain belongs to a partner
    school.

    Optionally filter by name using the `search` query parameter (case-insensitive
    substring match on the school name).

    ## Query params

    | Param    | Description                                    |
    | -------- | ---------------------------------------------- |
    | `search` | Optional name filter (case-insensitive substring) |

    ## Success (200)

    ```json
    {
      "status": true,
      "message": "ok",
      "data": {
        "schools": [
          {
            "id": 1,
            "name": "Covenant University",
            "domain": "stu.cu.edu.ng",
            "created_at": "2026-01-01T00:00:00Z"
          }
        ]
      }
    }
    ```
