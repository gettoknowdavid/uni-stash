$kind: http-request
name: Get School
method: GET
url: '{{baseUrl}}/api/v1/schools/{{schoolId}}'
order: 3000
auth:
  type: noauth
docs:
  description: |-
    Fetch a single partner school by its integer ID. Public endpoint.

    ## Path variables

    | Variable   | Type    | Description      |
    | ---------- | ------- | ---------------- |
    | `schoolId` | integer | School's numeric ID |

    ## Success (200)

    ```json
    {
      "status": true,
      "message": "ok",
      "data": {
        "id": 1,
        "name": "Covenant University",
        "domain": "stu.cu.edu.ng",
        "created_at": "2026-01-01T00:00:00Z"
      }
    }
    ```

    ## Errors

    | Status | Code        | Meaning          |
    | ------ | ----------- | ---------------- |
    | 404    | `not_found` | School not found |
