$kind: collection
name: Uni-Stash API
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
variables:
  - key: baseUrl
    value: http://localhost:8080
    disabled: false
  - key: accessToken
    secret: true
    disabled: false
  - key: refreshToken
    value: ""
    disabled: false
  - key: listingId
    value: ""
    disabled: false
  - key: imageId
    value: ""
    disabled: false
  - key: objectKey
    value: ""
    disabled: false
  - key: verificationToken
    value: ""
    disabled: false
  - key: schoolId
    value: ""
    disabled: false
  - key: adminAccessToken
    secret: true
    disabled: false
  - key: adminRefreshToken
    value: ""
    disabled: false
