$kind: http-request
name: My Sales
method: GET
url: '{{baseUrl}}/api/v1/sales/mine'
order: 2000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
queryParams:
  - key: cursor
    value: ''
    disabled: true
  - key: limit
    value: '20'
    disabled: true
docs:
  description: |-
    Return a paginated list of items the authenticated user has **sold**
    (i.e. sales records where the user is the seller).

    Results are ordered newest first. Use `next_cursor` for pagination.

    ## Query params

    | Param    | Default | Max | Description                               |
    | -------- | ------- | --- | ----------------------------------------- |
    | `cursor` | —       | —   | Opaque cursor from previous `next_cursor` |
    | `limit`  | 20      | 50  | Max records per page                      |

    ## Success (200)

    ```json
    {
      "status": true,
      "message": "ok",
      "data": {
        "sales": [
          {
            "id": "01984af1-…",
            "listing_id": "…",
            "buyer_id": "…",
            "seller_id": "…",
            "price": 250000,
            "currency": "NGN",
            "barter_request": null,
            "listing_title": "Calculus Textbook",
            "created_at": "2026-09-20T10:00:00Z"
          }
        ],
        "next_cursor": null
      }
    }
    ```

    > **Note:** `price` is in **minor units** (kobo for NGN). A `null` price
    > with a non-null `barter_request` indicates a barter sale.

    ## Errors

    | Status | Code           | Meaning                  |
    | ------ | -------------- | ------------------------ |
    | 401    | `unauthorized` | Missing or invalid token |
    | 429    | `too_many_requests` | Rate limited        |
