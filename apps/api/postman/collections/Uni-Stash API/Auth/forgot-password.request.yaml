$kind: http-request
name: Forgot Password
method: POST
url: '{{baseUrl}}/api/v1/auth/forgot-password'
order: 7000
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "david.michael@stu.cu.edu.ng"
    }
docs:
  description: |-
    Initiate the password-reset flow by sending a 6-digit OTP to the
    registered email address.

    Like `/resend-verification`, this endpoint **always returns 200** to
    prevent account enumeration — no email is sent if the address is not
    registered.

    ## Flow

    1. `POST /auth/forgot-password` → OTP sent to email
    2. `POST /auth/verify-otp` with `otp_type: "password_reset"` → `verified: true`
    3. `POST /auth/reset-password` with the same OTP code + new password

    ## Request body

    | Field   | Type   | Rules              |
    | ------- | ------ | ------------------ |
    | `email` | string | Valid email format |

    ## Success (200)

    ```json
    {
      "status": true,
      "message": "if that email is registered, a password reset code has been sent"
    }
    ```

    ## Errors

    | Status | Code                | Meaning       |
    | ------ | ------------------- | ------------- |
    | 422    | `validation`        | Invalid email |
    | 429    | `too_many_requests` | Rate limited  |
