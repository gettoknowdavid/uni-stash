$kind: http-request
name: Reset Password
method: POST
url: '{{baseUrl}}/api/v1/auth/reset-password'
order: 7500
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "code": "847291",
      "new_password": "NewSecurePass1!"
    }
docs:
  description: |-
    Complete the password-reset flow. Consumes the OTP code from
    `POST /auth/forgot-password` and sets a new password.

    The OTP is validated and consumed in a single atomic operation — it
    cannot be reused. After success the user must log in with the new
    password via `POST /auth/login`.

    ## Request body

    | Field          | Type   | Rules                          |
    | -------------- | ------ | ------------------------------ |
    | `code`         | string | Exactly 6 digits (from email)  |
    | `new_password` | string | Minimum 10 characters          |

    ## Success (200)

    ```json
    {
      "status": true,
      "message": "password reset successfully"
    }
    ```

    ## Errors

    | Status | Code                | Meaning                          |
    | ------ | ------------------- | -------------------------------- |
    | 400    | `bad_request`       | Invalid or expired OTP           |
    | 422    | `validation`        | Code not 6 digits / password too short |
    | 429    | `too_many_requests` | Rate limited                     |
