$kind: http-request
name: Sign Up
method: POST
url: '{{baseUrl}}/api/v1/auth/signup'
order: 1000
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "student@university.edu",
      "password": "Password123!",
      "display_name": "John Doe"
    }
