$kind: http-request
name: Verify OTP
method: POST
url: "{{baseUrl}}/api/v1/auth/verify-otp"
order: 2000
auth:
  type: noauth
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "code": "693246",
      "otp_type": "email_verify"
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200) {
          const body = pm.response.json();
          // For email_verify, the response includes tokens — capture them
          // so the user is immediately authenticated after verification.
          if (body.access_token) {
              pm.collectionVariables.set("accessToken", body.access_token);
              pm.collectionVariables.set("refreshToken", body.refresh_token);
          }
      }
    language: text/javascript
