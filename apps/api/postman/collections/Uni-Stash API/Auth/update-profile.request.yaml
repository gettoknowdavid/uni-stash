$kind: http-request
name: Update Profile
method: PATCH
url: '{{baseUrl}}/api/v1/auth/me'
order: 5500
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "display_name": "David Michael II"
    }
docs:
  description: |-
    Update the authenticated user's profile fields.

    Currently only `display_name` is updatable. At least one field must be
    provided; omitting all fields returns `400 Bad Request`.

    ## Request body

    | Field          | Type   | Rules           |
    | -------------- | ------ | --------------- |
    | `display_name` | string | 1–80 characters |

    ## Success (200)

    Returns the full updated profile:

    ```json
    {
      "status": true,
      "message": "profile updated successfully",
      "data": {
        "id": "01984af1-…",
        "email": "david.michael@stu.cu.edu.ng",
        "display_name": "David Michael II",
        "email_verified": true,
        "role": "user"
      }
    }
    ```

    ## Errors

    | Status | Code           | Meaning                              |
    | ------ | -------------- | ------------------------------------ |
    | 400    | `bad_request`  | No fields provided                   |
    | 401    | `unauthorized` | Missing or invalid token             |
    | 422    | `validation`   | display_name too long / empty        |
    | 429    | `too_many_requests` | Rate limited                    |
