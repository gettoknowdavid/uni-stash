$kind: http-request
name: Get Current User
method: GET
url: '{{baseUrl}}/api/v1/auth/me'
order: 5000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
docs:
  description: |-
    Return the authenticated user's profile.

    Requires a valid Bearer token. The `email_verified` flag indicates
    whether the user has completed OTP verification.

    ## Success (200)

    ```json
    {
      "status": true,
      "message": "ok",
      "data": {
        "id": "01984af1-…",
        "email": "david.michael@stu.cu.edu.ng",
        "display_name": "David Michael",
        "email_verified": true,
        "role": "user"
      }
    }
    ```

    ## Errors

    | Status | Code            | Meaning                   |
    | ------ | --------------- | ------------------------- |
    | 401    | `unauthorized`  | Missing or invalid token  |
    | 403    | `token_expired` | Access token has expired  |
