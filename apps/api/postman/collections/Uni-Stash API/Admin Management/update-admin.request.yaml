$kind: http-request
name: Update Admin
method: PATCH
url: '{{baseUrl}}/api/v1/admin/admins/{{adminId}}'
order: 3000
auth:
  type: bearer
  credentials:
    token: "{{adminAccessToken}}"
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "display_name": "Updated Admin Name",
      "level": "standard",
      "permissions": {
        "schools": ["write"]
      }
    }
