$kind: http-request
name: List Admins
method: GET
url: '{{baseUrl}}/api/v1/admin/admins'
order: 2000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{adminAccessToken}}'
docs:
  description: |-
    Return all admin accounts (super admin only).

    ## Success (200)

    ```json
    {
      "status": true,
      "message": "ok",
      "data": {
        "admins": [
          {
            "id": "01984af1-…",
            "email": "admin@uni-stash.com",
            "display_name": "Super Admin",
            "level": "super",
            "is_active": true,
            "created_at": "2026-01-01T00:00:00Z"
          }
        ]
      }
    }
    ```

    ## Errors

    | Status | Code           | Meaning                        |
    | ------ | -------------- | ------------------------------ |
    | 401    | `unauthorized` | Missing or invalid admin token |
    | 403    | `forbidden`    | Requester is not a super admin |
    | 429    | `too_many_requests` | Rate limited              |
