[package]
name = "uni-stash-be"
version = "0.1.0"
edition = "2024"
default-run = "uni-stash-be"

[dependencies]
actix-governor = "0.10.0"
async-trait = "0.1.89"
md-5 = "0.10.6"
actix-web = "4.14.1"
anyhow = "1.0.104"
argon2 = { version = "0.5.3", features = ["default"] }
aws-sdk-s3 = { version = "1.141.0", features = ["rustls"] }
base64 = "0.23.1"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15.7"
futures = "0.3.34"
hex = "0.4.3"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
lettre = { version = "0.11", features = ["tokio1-native-tls"] }
rand = "0.10.2"
regex = "1"
reqwest = { version = "0.13.4", features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = { version = "0.11.0", features = ["oid"] }
# Pairs with sha2 0.11 (digest 0.11 line) so Hmac<Sha256> resolves to one digest version.
hmac = { version = "0.13.0" }
sqlx = { version = "0.9.0", features = ["macros", "migrate", "postgres", "runtime-tokio", "time", "tls-rustls", "uuid"] }
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["serde", "serde-well-known"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-actix-web = "0.7.22"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.24.1", features = ["serde", "v4"] }
validator = { version = "0.21.0", features = ["derive"] }

[dev-dependencies]
actix-rt = "2.10"
wiremock = "0.6"

[profile.dev]
debug = 1