[package]
name = "uni-stash-be"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.14.1"
anyhow = "1.0.104"
aws-sdk-s3 = { version = "1.141.0", features = ["rustls"] }
dotenvy = "0.15.7"
jsonwebtoken = "11.0.0"
reqwest = { version = "0.13.4", features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["macros", "postgres", "runtime-tokio"] }
thiserror = "2.0.20"
tokio = "1.53.1"
tracing = "0.1.44"

[dev-dependencies]
actix-rt = "2.10"
